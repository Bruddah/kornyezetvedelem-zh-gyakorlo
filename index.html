<style>
/* Layout: one centered column like a field notebook; a sticky scoreboard strip on top, then home / card / results views. */
:root{
  --bg:#eef3ef; --paper:#fbfdfb; --ink:#14261f; --muted:#5b6f66; --line:#cfdcd4;
  --accent:#0f7a5c; --accent-ink:#ffffff; --sky:#2a6fb0; --sun:#d98a10; --bad:#c2412d; --good:#1f8a4c;
  --chip:#e2ece6; --hi:#fff3cf;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1714; --paper:#14211c; --ink:#e3efe8; --muted:#93a89e; --line:#27392f;
  --accent:#3fc496; --accent-ink:#06130e; --sky:#6aa8e0; --sun:#f0b04a; --bad:#ef7b66; --good:#5fd08f;
  --chip:#1d2e27; --hi:#3a3216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1714; --paper:#14211c; --ink:#e3efe8; --muted:#93a89e; --line:#27392f;
  --accent:#3fc496; --accent-ink:#06130e; --sky:#6aa8e0; --sun:#f0b04a; --bad:#ef7b66; --good:#5fd08f;
  --chip:#1d2e27; --hi:#3a3216; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* scoreboard */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.bar .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.lvl .badge{font-family:var(--f-display);font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:4px 10px;white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--chip);border-radius:99px;overflow:hidden;min-width:60px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--sun));width:0;transition:width .5s}
.stat{display:flex;gap:6px;align-items:baseline;font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--f-mono);font-size:15px}
.combo b{color:var(--sun)}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-bottom:20px}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800;line-height:1.02}
.hero p{margin:8px 0 0;color:var(--muted);max-width:52ch}
.count{text-align:right}
.count .big{font-family:var(--f-mono);font-size:30px;font-weight:700;line-height:1}
.count small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:560px){.hero{grid-template-columns:1fr}.count{text-align:left}}

.meter{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px}
.meter .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.meter h3{font-size:17px}
.scale{display:grid;grid-template-columns:18fr 4fr 4fr 5fr 6fr;margin-top:12px;height:30px;border-radius:8px;overflow:hidden;position:relative;font-size:11px;font-family:var(--f-mono)}
.scale span{display:flex;align-items:center;justify-content:center;color:var(--ink);border-right:1px solid var(--paper)}
.scale span:nth-child(1){background:color-mix(in srgb,var(--bad) 22%,var(--paper))}
.scale span:nth-child(2){background:color-mix(in srgb,var(--sun) 18%,var(--paper))}
.scale span:nth-child(3){background:color-mix(in srgb,var(--sun) 30%,var(--paper))}
.scale span:nth-child(4){background:color-mix(in srgb,var(--good) 22%,var(--paper))}
.scale span:nth-child(5){background:color-mix(in srgb,var(--good) 42%,var(--paper));font-weight:700}
.pin{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px;transition:left .6s;left:0}
.scalelbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:4px}
.meter p{margin:10px 0 0;color:var(--muted);font-size:13px}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:26px}
.mode{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode b{font-family:var(--f-display);font-size:18px}
.mode span{font-size:13px;color:var(--muted)}
.mode.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode.primary span{color:inherit;opacity:.85}

.sect{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;gap:10px;flex-wrap:wrap}
.sect h2{font-size:20px}
.sect small{color:var(--muted)}
.topics{display:grid;gap:8px;margin-bottom:26px}
.topic{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink)}
.topic:hover{border-color:var(--accent)}
.topic .no{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.topic .nm{min-width:0}
.topic .nm b{display:block;font-weight:600}
.topic .prog{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:6px}
.topic .prog i{display:block;height:100%;background:var(--accent);width:0}
.topic .st{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.topic a{font-size:12px;color:var(--sky)}

.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{font-size:12px;padding:6px 10px;border-radius:99px;border:1px dashed var(--line);color:var(--muted)}
.bdg.on{border-style:solid;border-color:var(--sun);color:var(--ink);background:color-mix(in srgb,var(--sun) 14%,var(--paper))}

/* card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px -18px rgba(0,0,0,.35)}
.cardhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.03em;text-transform:uppercase}
.stars{letter-spacing:2px;color:var(--sun)}
.q{font-family:var(--f-display);font-size:clamp(21px,3.6vw,27px);font-weight:700;line-height:1.2;margin-bottom:6px}
.need{font-size:13px;color:var(--muted);margin-bottom:14px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px;font:inherit;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.spacer{flex:1}
.pts{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:6px}
.pts li label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.pts li label.hit{background:var(--hi);border-color:var(--sun)}
.pts input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.note{font-size:13px;color:var(--muted);margin-top:10px;border-left:3px solid var(--line);padding-left:10px}
.score{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.score .s{font-family:var(--f-mono);font-size:34px;font-weight:700;line-height:1}
.score .s small{font-size:16px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--chip)}
.dots i.on{background:var(--accent)}
.toast{font-family:var(--f-mono);color:var(--sun);font-weight:700}
.prog2{height:5px;background:var(--chip);border-radius:9px;overflow:hidden;margin-bottom:14px}
.prog2 i{display:block;height:100%;background:var(--sky);width:0;transition:width .3s}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.timer.hot{color:var(--bad);font-weight:700}

/* lightning */
.flash-ans{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.flash-ans ul{margin:0;padding-left:18px}

/* results */
.res h2{font-size:clamp(26px,5vw,38px)}
.grade{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:1;color:var(--accent)}
.restable{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.restable td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.restable td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.tw{overflow-x:auto}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const MINTA=[3,21,25,28,32,45,54,67,75]; // indexek: a Minta ZH 9 kérdése sorrendben
const LEVELS=[[0,"Csíra"],[120,"Hajtás"],[300,"Facsemete"],[600,"Fa"],[1000,"Liget"],[1500,"Erdő"],[2200,"Ökoszisztéma"],[3000,"Bioszféra"]];
const ZH_DATE=new Date("2026-11-26T12:10:00+01:00");
const BADGES=[["elso","Első válasz"],["telitalalat","Első 4/4"],["combo5","Combo ×5"],["tema","Egy téma minden kérdése megvan"],["fel","A kérdések fele megvan"],["mind","Mind a "+Q.length+" kérdés megvan"],["minta","Minta ZH lefutva"],["jeles","Jeles ZH-próba (31+)"],["villam","Villámkör: 12+ tudtam"]];

/* ---------- State ---------- */
const KEY="kv-zh-gyakorlo-v1";
let S={xp:0,combo:0,m:{},badges:[],days:[],bestFlash:0};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/₂/g,"2").replace(/₄/g,"4").replace(/₅/g,"5").replace(/³/g,"3");
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>new Date().toISOString().slice(0,10);

function lvl(){let i=0;LEVELS.forEach((l,k)=>{if(S.xp>=l[0])i=k});const cur=LEVELS[i],nx=LEVELS[i+1];return{name:cur[1],pct:nx?(S.xp-cur[0])/(nx[0]-cur[0])*100:100}}
function streak(){const d=[...new Set(S.days)].sort();let n=0;let t=new Date(today());while(d.includes(t.toISOString().slice(0,10))){n++;t.setDate(t.getDate()-1)}return n}
function hud(){const L=lvl();$("#lvlName").textContent=L.name;$("#xpFill").style.width=L.pct+"%";$("#xp").textContent=S.xp;$("#combo").textContent="×"+S.combo;$("#streak").textContent=streak()}
function mastery(i){return S.m[i]||{s:0,n:0,b:0}}
function predicted(){let t=0;Q.forEach((_,i)=>t+=mastery(i).s);return t/Q.length*9}
function grade(p){return p>=31?5:p>=26?4:p>=22?3:p>=18?2:1}
const GNAME={5:"jeles",4:"jó",3:"közepes",2:"elégséges",1:"elégtelen"};
function award(id){if(!S.badges.includes(id)){S.badges.push(id);save();fx(40)}}
function checkBadges(){
  const seen=Object.keys(S.m).length;
  if(seen>=1)award("elso");
  if(seen>=Q.length/2)award("fel");
  if(seen>=Q.length)award("mind");
  if(TOPICS.some((_,t)=>Q.every((q,i)=>q[0]!==t||S.m[i])))award("tema");
}

/* ---------- Scoring ---------- */
function autoHits(i,text){const t=norm(text);return Q[i][4].map(p=>t.trim().length>0&&new RegExp(p[1]).test(t))}
function scoreOf(i,checks){const hits=checks.filter(Boolean).length;return Math.min(4,Math.round(4*hits/Q[i][2]))}
function commit(i,sc,mult=true){
  const m=mastery(i);m.n++;m.s=sc;m.b=sc===4?Math.min(3,m.b+1):sc>=2?m.b:0;S.m[i]=m;
  if(sc===4){S.combo++;award("telitalalat")}else S.combo=0;
  if(S.combo>=5)award("combo5");
  const gain=Math.round(sc*10*(mult?1+0.25*Math.min(S.combo,4):1));
  S.xp+=gain;if(!S.days.includes(today()))S.days.push(today());
  checkBadges();save();hud();return gain;
}

  </div>

    return `<div class="topic"><span class="no">${String(k+1).padStart(2,"0")}</span><div class="nm"><button class="btn ghost" data-t="${k}" style="padding:0;border:0;text-align:left;font-weight:600">${esc(t.n)}</button><div class="prog"><i style="width:${st/max*100}%"></i></div></div><div class="st">${pts}/${qs.length*4} p<br><a href="https://szelearning.sze.hu/mod/resource/view.php?id=${t.u}" target="_blank" rel="noopener">dia ↗</a></div></div>`}).join("")}</div>
  <div class="sect"><h2>Kitűzők</h2><small>${S.badges.length}/${BADGES.length}</small></div>

function practiceQueue(t){
  let ids=Q.map((_,i)=>i).filter(i=>t===null||Q[i][0]===t);
  ids=shuffle(ids).sort((a,b)=>(mastery(a).b-mastery(b).b)||(mastery(a).s-mastery(b).s));
  return ids;
}
function practice(t){
  const queue=practiceQueue(t);let pos=0,sessionPts=0,done=0;
  const next=()=>{if(pos>=queue.length){pos=0;queue.splice(0,queue.length,...practiceQueue(t))}
    card(queue[pos++],{title:t===null?"Gyakorlás · minden téma":"Gyakorlás · "+TOPICS[t].n,progress:null,onDone:(sc)=>{sessionPts+=sc;done++;next()},footer:()=>`${done} kérdés · ${sessionPts} pont ebben a körben`})};
  next();
}

let timerId=null;function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function zh(isMinta){
  let ids;
  if(isMinta) ids=MINTA.slice();
  else{const groups=[[0],[1,2],[3],[4,5],[4,5],[6,7],[7],[8],[9,10]];ids=[];groups.forEach(g=>{const pool=Q.map((_,i)=>i).filter(i=>g.includes(Q[i][0])&&!ids.includes(i));ids.push(shuffle(pool)[0])})}
  const res=[];let k=0;const t0=Date.now();
  const step=()=>{if(k>=ids.length)return zhResult(ids,res,isMinta,Date.now()-t0);
    card(ids[k],{title:(isMinta?"Minta ZH":"ZH-próba")+` · ${k+1}/9. kérdés`,progress:k/9,zh:true,t0,onDone:(sc)=>{res.push(sc);k++;step()},footer:()=>`eddig ${res.reduce((a,b)=>a+b,0)} / ${res.length*4} pont`})};
  step();
}
function zhResult(ids,res,isMinta,ms){
  stopTimer();
  const tot=res.reduce((a,b)=>a+b,0),g=grade(tot);
  if(isMinta)award("minta");if(g===5){award("jeles");fx(160)}
  S.xp+=tot*3;save();hud();
  app.innerHTML=`<section class="card res">
   <div class="cardhead"><span>${isMinta?"Minta ZH":"ZH-próba"} vége</span><span class="num">${Math.round(ms/60000)} perc</span></div>
   <div class="row" style="align-items:flex-end;gap:22px"><div class="grade">${g}</div><div><h2 class="num">${tot} / 36 pont</h2><div style="color:var(--muted)">${GNAME[g]}${g<5?` · a jeleshez még ${31-tot} pont kellett volna`:" · megvan az ötös!"}</div></div></div>
   <div class="tw"><table class="restable">${ids.map((i,k)=>`<tr><td>${esc(Q[i][1])}<br><small style="color:var(--muted)">${esc(TOPICS[Q[i][0]].n)}</small></td><td>${res[k]}/4</td></tr>`).join("")}</table></div>
   <div class="row"><button class="btn go" id="again">Új ZH-próba</button><button class="btn" id="weak">A gyengéket gyakorlom</button><span class="spacer"></span><button class="btn ghost" id="back">Főoldal</button></div>
   <p class="note">+${tot*3} XP bónusz a ZH-próbáért. Pontozás a tanszéki skálán: 0–17: 1 · 18–21: 2 · 22–25: 3 · 26–30: 4 · 31–36: 5.</p></section>`;
  $("#again").onclick=()=>zh(false);$("#back").onclick=home;
  $("#weak").onclick=()=>{const w=ids.filter((i,k)=>res[k]<4);if(!w.length)return practice(null);let p=0;const nx=()=>{if(p>=w.length)return home();card(w[p++],{title:"Gyengék újra",onDone:nx,footer:()=>`${p}/${w.length}`})};nx()};
  window.scrollTo(0,0);
}

function card(i,o){
  const q=Q[i],m=mastery(i);
  app.innerHTML=`<div class="top-actions"><button class="btn ghost" id="quit">← Főoldal</button><span class="timer num" id="timer"></span></div>
  ${o.progress!=null?`<div class="prog2"><i style="width:${o.progress*100}%"></i></div>`:""}
  <section class="card">
    <div class="cardhead"><span>${esc(o.title)}</span><span>${esc(TOPICS[q[0]].n)} <span class="stars" title="elsajátítás">${"★".repeat(m.b)}${"☆".repeat(3-m.b)}</span></span></div>
    <div class="q">${esc(q[1])}</div>
    <div class="need">4 pont · a teljes ponthoz ${q[2]} jó elem kell${q[3]?" · <b>szerepelt a minta ZH-ban</b>":""}</div>
    <label for="ans" style="font-size:13px;color:var(--muted)">A válaszod (kulcsszavakra pontoz, a sorrend és a helyesírás mindegy)</label>
    <textarea id="ans" placeholder="pl. litoszféra, hidroszféra, …"></textarea>
    <div class="row" id="act"><button class="btn go" id="check">Ellenőrzés</button><button class="btn ghost" id="show">Nem tudom, mutasd</button><span class="spacer"></span><small style="color:var(--muted)" id="foot">${o.footer?esc(o.footer()):""}</small></div>
    <div id="reveal"></div>
  </section>`;
  $("#quit").onclick=home;
  if(o.zh){const tick=()=>{const s=(Date.now()-o.t0)/1000|0;const el=$("#timer");if(el){el.textContent=`${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")} / 45:00`;el.classList.toggle("hot",s>=2400)}};stopTimer();tick();timerId=setInterval(tick,1000)}else stopTimer();
  const ta=$("#ans");ta.focus({preventScroll:true});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();reveal()}});
  const reveal=()=>{
    const checks=autoHits(i,ta.value);
    $("#act").remove();ta.readOnly=true;
    $("#reveal").innerHTML=`<ul class="pts">${q[4].map((p,k)=>`<li><label class="${checks[k]?"hit":""}"><input type="checkbox" data-k="${k}" ${checks[k]?"checked":""}><span>${esc(p[0])}</span></label></li>`).join("")}</ul>
      ${q[5]?`<p class="note">${esc(q[5])}</p>`:""}
      <div class="score"><div class="s num" id="sc">0<small>/4</small></div><div class="dots" id="dots">${"<i></i>".repeat(4)}</div><small style="color:var(--muted);flex:1;min-width:180px">A sárgákat a gép találta meg a szövegedben. Pipáld be, amit tudtál, vedd ki, amit mégsem.</small></div>
      <div class="row"><button class="btn go" id="next">Pont elfogadva, tovább</button><span class="toast" id="toast"></span></div>`;
    const upd=()=>{const c=[...app.querySelectorAll(".pts input")].map(x=>x.checked);const sc=scoreOf(i,c);$("#sc").innerHTML=sc+"<small>/4</small>";$("#dots").querySelectorAll("i").forEach((d,k)=>d.classList.toggle("on",k<sc));app.querySelectorAll(".pts label").forEach((l,k)=>l.classList.toggle("hit",c[k]));return sc};
    app.querySelectorAll(".pts input").forEach(x=>x.onchange=upd);upd();
    $("#next").onclick=()=>{const sc=upd();const gain=commit(i,sc,!o.zh);$("#toast").textContent=`+${gain} XP${S.combo>1?" · combo ×"+S.combo:""}`;if(sc===4)fx(S.combo>=3?60:25);$("#next").disabled=true;setTimeout(()=>o.onDone(sc),sc===4?650:350)};
    $("#next").focus({preventScroll:true});
  };
  $("#check").onclick=reveal;$("#show").onclick=()=>{ta.value="";reveal()};
  window.scrollTo(0,0);
}

function flash(){
  stopTimer();
  const ids=shuffle(Q.map((_,i)=>i));let p=0,ok=0,combo=0,best=0,left=90,shown=false;
  app.innerHTML=`<div class="top-actions"><button class="btn ghost" id="quit">← Főoldal</button><span class="timer num" id="ft">90 mp</span></div>

  <div class="row" id="fb"></div><p class="note">Gondold végig fejben, nyisd meg a választ, és légy őszinte magaddal. Tudtam = +15 XP × combo.</p></section>`;
  $("#quit").onclick=()=>{stopTimer();home()};
  const draw=()=>{shown=false;const q=Q[ids[p%ids.length]];$("#fq").textContent=q[1];$("#fa").innerHTML="";$("#fb").innerHTML=`<button class="btn go" id="fr">Válasz megnézése</button>`;$("#fr").onclick=show;$("#fr").focus({preventScroll:true})};
  const show=()=>{shown=true;const q=Q[ids[p%ids.length]];$("#fa").innerHTML=`<div class="flash-ans"><ul>${q[4].map(x=>`<li>${esc(x[0])}</li>`).join("")}</ul><small style="color:var(--muted)">${q[2]} elem kell a teljes ponthoz</small></div>`;
    $("#fb").innerHTML=`<button class="btn go" id="y">Tudtam</button><button class="btn" id="n">Nem tudtam</button>`;
    $("#y").onclick=()=>{ok++;combo++;best=Math.max(best,combo);S.xp+=Math.round(15*(1+0.2*Math.min(combo,5)));if(!S.days.includes(today()))S.days.push(today());save();hud();if(combo%3===0)fx(20);p++;upd();draw()};
    $("#n").onclick=()=>{combo=0;p++;upd();draw()}};
  const upd=()=>{$("#fs").textContent=`${ok} tudtam · combo ×${combo}`};
  draw();
  timerId=setInterval(()=>{left--;const el=$("#ft");if(!el)return stopTimer();el.textContent=left+" mp";el.classList.toggle("hot",left<=10);if(left<=0){stopTimer();
    if(ok>=12)award("villam");S.bestFlash=Math.max(S.bestFlash||0,ok);save();
    app.innerHTML=`<section class="card res"><div class="cardhead"><span>Villámkör vége</span><span>rekord: <b class="num">${S.bestFlash}</b></span></div><h2 class="num">${ok} tudtam / ${p} kérdés</h2><p style="color:var(--muted)">Leghosszabb combo: ×${best}. Ami nem ment, azt a Gyakorlás módban pontosan is kipróbálhatod.</p><div class="row"><button class="btn go" id="again">Még egy kör</button><span class="spacer"></span><button class="btn ghost" id="back">Főoldal</button></div></section>`;
    $("#again").onclick=flash;$("#back").onclick=home;if(ok>=10)fx(80)}},1000);
}

/* ---------- Confetti ---------- */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function fx(n){if(reduce)return;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement);const cols=["--accent","--sun","--sky","--good"].map(v=>cs.getPropertyValue(v).trim());
  for(let k=0;k<n;k++)parts.push({x:innerWidth*(.2+.6*Math.random()),y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,r:Math.random()*6+3,c:cols[k%4],a:Math.random()*6,l:90});
  if(!raf)loop()}
function loop(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.a+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  parts=parts.filter(p=>p.l>0&&p.y<innerHeight+20);raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

home();
</script>
