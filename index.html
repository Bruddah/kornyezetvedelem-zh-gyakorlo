<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Környezetvédelem ZH-gyakorló</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a field-study desk. Every question is a ruled index card that flips; each lecture is a colour-coded deck. One centered column, sticky score strip on top. */
:root{
  --bg:#e5eae1; --bg2:#d9e0d4; --paper:#fbfcf7; --ink:#12201a; --muted:#56685e; --line:#c6d1c4;
  --accent:#145c3c; --accent-ink:#f2fbf5; --good:#1c8a4d; --bad:#c03a28; --warn:#c07a0f; --hi:#fff0bd;
  --band-ink:#ffffff; --tl:.55; --tc:.15; --tt:.93; --ttc:.05;
  --shadow:0 1px 0 rgba(18,32,26,.05),0 22px 44px -26px rgba(18,32,26,.55);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1411; --bg2:#111c18; --paper:#16221d; --ink:#e3eee7; --muted:#8fa499; --line:#26382f;
  --accent:#62d49d; --accent-ink:#06140d; --good:#5fd08f; --bad:#ff7a66; --warn:#f2b04a; --hi:#3a3316;
  --band-ink:#0a1410; --tl:.77; --tc:.13; --tt:.27; --ttc:.045;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 24px 48px -24px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1411; --bg2:#111c18; --paper:#16221d; --ink:#e3eee7; --muted:#8fa499; --line:#26382f;
  --accent:#62d49d; --accent-ink:#06140d; --good:#5fd08f; --bad:#ff7a66; --warn:#f2b04a; --hi:#3a3316;
  --band-ink:#0a1410; --tl:.77; --tc:.13; --tt:.27; --ttc:.045;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 24px 48px -24px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
[style*="--h"]{--c:oklch(var(--tl) var(--tc) var(--h));--tint:oklch(var(--tt) var(--ttc) var(--h))}

/* score strip */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:10px;margin-bottom:8px}
.bar .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:10px;flex:1 1 200px;min-width:0}
.lvl .badge{font-family:var(--f-display);font-weight:700;font-size:12px;background:var(--ink);color:var(--bg);border-radius:99px;padding:5px 11px;white-space:nowrap;letter-spacing:.02em}
.xpbar{flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;min-width:60px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,oklch(var(--tl) var(--tc) 150),oklch(var(--tl) var(--tc) 85),oklch(var(--tl) var(--tc) 30));width:0;transition:width .6s}
.stat{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{color:var(--ink);font-family:var(--f-mono);font-size:15px;letter-spacing:0}
.combo b{color:var(--warn)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:26px 30px;position:relative}
.hero::before{content:"";position:absolute;inset:-40px -30vw 0 -30vw;z-index:-1;pointer-events:none;opacity:.55;
  background:repeating-radial-gradient(ellipse 120% 90% at 78% 40%,transparent 0 26px,color-mix(in srgb,var(--line) 70%,transparent) 26px 27px);
  -webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent);mask-image:linear-gradient(to bottom,#000 40%,transparent)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 14px;font-weight:600}
.hero h1{font-size:clamp(34px,5.4vw,50px);font-weight:800;line-height:1}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);max-width:42ch;margin:16px 0 22px;font-size:17px}
.cd{display:flex;align-items:center;gap:14px}
.cd-n{font-size:34px;font-weight:700;line-height:1;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px}
.cd-n small{font-size:15px;opacity:.7;margin-left:2px}
.cd-l{font-size:13px;color:var(--muted);line-height:1.35}
.hero-deck{position:relative;padding:14px 8px 6px}
.gcard{position:absolute;inset:14px 8px 34px;border-radius:18px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.gcard::before{content:"";display:block;height:38px;background:var(--c)}
.g1{transform:rotate(-7deg) translate(-14px,10px)}
.g2{transform:rotate(5deg) translate(16px,4px)}
.hero-deck .scene{z-index:1}
.hero-deck .side{min-height:300px}
@media (max-width:700px){.hero{grid-template-columns:1fr;gap:26px}.hero-deck{max-width:460px;width:100%;justify-self:center}}

/* index card (flip) */
.scene{position:relative;perspective:1600px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.scene.drag{transition:none}
.scene.fly{transition:transform .32s cubic-bezier(.5,0,.8,.4)}
.fc{display:grid;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.35,.45,1);cursor:pointer;border-radius:18px}
.fc.flip{transform:rotateY(180deg)}
.side{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:330px}
.back{transform:rotateY(180deg);position:absolute;inset:0;min-height:0}
.back .sb{overflow:auto;min-height:0;overscroll-behavior:contain}
.fc:not(.flip) .back,.fc.flip .front{pointer-events:none}
.band{display:flex;align-items:center;gap:10px;background:var(--c);color:var(--band-ink);padding:9px 14px;font-size:12px;font-weight:600;min-width:0}
.b-no{font-weight:700;font-size:13px}
.b-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-mz{border:1.5px solid currentColor;border-radius:99px;padding:0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.b-code{opacity:.75;font-size:11px;white-space:nowrap}
.sb{padding:22px 22px 18px;flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.front .sb{justify-content:center}
.ruled{background:
  linear-gradient(90deg,transparent 0 40px,color-mix(in srgb,var(--c) 55%,transparent) 40px 41.5px,transparent 41.5px),
  repeating-linear-gradient(to bottom,transparent 0 33px,color-mix(in srgb,var(--c) 16%,transparent) 33px 34px);padding-left:56px}
.ruled{gap:0;padding-top:0}
.ruled .bk-h{line-height:34px}
.ruled .alist{gap:0;line-height:34px}
.ruled .pts,.ruled .score,.ruled .cnote,.ruled #vd{margin-top:8px}
.ruled #vd:empty{display:none}
.qq{font-family:var(--f-body);font-weight:700;font-size:clamp(21px,3.7vw,29px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.front .qq{text-align:center}
.meta{font-size:13px;color:var(--muted);text-align:center}
.hint{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;padding:0 16px 14px}
.bk-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.alist{margin:0;padding-left:20px;display:grid;gap:7px;font-size:16px;line-height:1.4}
.alist li::marker{font-family:var(--f-mono);font-size:13px;color:var(--c)}
.alist .gap{background:var(--hi);border-radius:6px;padding:0 8px;font-weight:700;font-family:var(--f-mono)}
.alist .hit{background:color-mix(in srgb,var(--good) 18%,transparent);border-radius:6px;padding:0 4px}
.cnote{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin:0}
.stamp{position:absolute;top:56px;z-index:3;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;padding:4px 12px;border:3px solid currentColor;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .1s}
.s-yes{left:20px;color:var(--good);transform:rotate(-12deg);opacity:var(--yes,0)}
.s-no{right:20px;color:var(--warn);transform:rotate(12deg);opacity:var(--no,0)}
.verdict{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:15px;padding:3px 10px;border:2.5px solid currentColor;border-radius:8px;transform:rotate(-4deg)}
.verdict.ok{color:var(--good)}.verdict.bad{color:var(--bad)}

/* checklist on the back */
.pts{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;line-height:1.35}
.pts label:hover{border-color:var(--line)}
.pts label.hit{background:var(--hi);border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.pts input{margin-top:3px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score .s{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1}
.score .s small{font-size:16px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:16px;height:16px;border-radius:5px;background:var(--bg2)}
.dots i.on{background:var(--c)}

/* dock under the card */
.dock{margin-top:16px;display:grid;gap:10px}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:14px;font:inherit;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .12s,background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.kbd{font-family:var(--f-mono);font-size:11px;opacity:.6;margin-left:4px}
.swipe{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swipe .btn{padding:15px;font-size:16px}
.btn.no{background:color-mix(in srgb,var(--warn) 14%,var(--paper));border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.btn.yes{background:color-mix(in srgb,var(--good) 16%,var(--paper));border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.undo{justify-self:center;color:var(--muted)}
.lock{color:var(--muted)}
.btn.yes:disabled{filter:grayscale(1)}
.toast{font-family:var(--f-mono);color:var(--warn);font-weight:700}
.small{font-size:13px;color:var(--muted)}

/* options */
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 14px;font-size:15.5px;line-height:1.35;transition:transform .15s,border-color .15s,background .15s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--ink)}
.opt .n{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--bg2);color:var(--muted)}
.opt.right{background:color-mix(in srgb,var(--good) 18%,var(--paper));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--paper));border-color:var(--bad)}
.opt:disabled{cursor:default}

/* top of a study view */
.tb{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.tb-t{flex:1;min-width:0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;text-align:center}
.tb-r{font-size:14px;color:var(--muted);min-width:70px;text-align:right}
.tb-r.hot{color:var(--bad);font-weight:700}
.prog{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .35s}
.ladder{display:flex;gap:5px;align-items:center}
.ladder i{width:20px;height:6px;border-radius:9px;background:color-mix(in srgb,var(--band-ink) 30%,transparent)}
.ladder i.on{background:var(--band-ink)}
.study{max-width:640px;margin:0 auto}

/* meter */
.sec{margin-top:34px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:22px;font-weight:700}
.sec-h small{color:var(--muted);font-size:13px}
.meter{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.meter .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.meter .big{font-family:var(--f-display);font-weight:800;font-size:28px}
.meter .big small{font-size:14px;color:var(--muted);font-weight:500}
.scale{display:grid;grid-template-columns:18fr 4fr 4fr 5fr 6fr;margin-top:14px;height:34px;border-radius:10px;overflow:visible;position:relative;font-size:12px;font-family:var(--f-mono)}
.scale span{display:flex;align-items:center;justify-content:center;border-right:2px solid var(--paper)}
.scale span:first-child{border-radius:10px 0 0 10px}.scale span:nth-child(5){border-radius:0 10px 10px 0;border-right:0}
.scale span:nth-child(1){background:color-mix(in srgb,var(--bad) 20%,var(--paper))}
.scale span:nth-child(2){background:color-mix(in srgb,var(--warn) 18%,var(--paper))}
.scale span:nth-child(3){background:color-mix(in srgb,var(--warn) 32%,var(--paper))}
.scale span:nth-child(4){background:color-mix(in srgb,var(--good) 24%,var(--paper))}
.scale span:nth-child(5){background:color-mix(in srgb,var(--good) 46%,var(--paper));font-weight:700}
.pin{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--ink);border-radius:3px;transition:left .8s cubic-bezier(.3,1.3,.5,1);left:0}
.scalelbl{position:relative;height:16px;font-size:11px;color:var(--muted);font-family:var(--f-mono);margin-top:6px}
.scalelbl span{position:absolute;transform:translateX(-50%)}
.meter p{margin:10px 0 0;color:var(--muted);font-size:13px}

/* deck picker */
.decks{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;padding:6px 4px 16px;scroll-snap-type:x mandatory;margin-inline:-4px}
.deck{scroll-snap-align:start;position:relative;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:168px;transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.deck:hover{transform:translateY(-4px) rotate(-1deg)}
.deck[aria-pressed="true"]{transform:translateY(-6px);box-shadow:0 0 0 3px var(--c),var(--shadow)}
.deck .d-top{background:var(--c);color:var(--band-ink);padding:10px 12px 8px;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.deck .d-n{padding:10px 12px 0;font-size:13.5px;font-weight:600;line-height:1.25;flex:1}
.deck .d-p{margin:10px 12px 0;height:5px;border-radius:9px;background:var(--bg2);overflow:hidden}
.deck .d-p i{display:block;height:100%;background:var(--c)}
.deck .d-s{padding:6px 12px 12px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{position:relative;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .25s cubic-bezier(.3,1.4,.5,1),border-color .2s;transform-style:preserve-3d}
.mode:hover{transform:perspective(700px) rotateX(4deg) rotateY(-5deg) translateY(-3px);border-color:var(--ink)}
.mode .m-k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.mode>b{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.mode span.d{font-size:13.5px;color:var(--muted);line-height:1.4}
.mode.hero-m{grid-column:span 2;grid-row:span 2;justify-content:flex-end;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.hero-m .m-k,.mode.hero-m span.d{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.mode.hero-m>b{font-size:34px}
.mstats{display:flex;height:8px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--bg) 18%,transparent);margin-top:auto}
.mstats i{display:block;height:100%}
.mstats .k{background:var(--good)}.mstats .w{background:var(--warn)}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:color-mix(in srgb,var(--bg) 72%,transparent)}
.mlegend b{font-family:var(--f-mono);color:var(--bg);font-size:13px}
@media (max-width:620px){.modes{grid-template-columns:1fr 1fr}.mode{min-height:130px}.mode.hero-m{grid-row:auto}}
@media (max-width:400px){.modes{grid-template-columns:1fr}.mode.hero-m{grid-column:auto;grid-row:auto}}
.slides{margin:12px 0 0;font-size:14px}
.slides a{color:var(--ink);text-underline-offset:3px}

/* badges as rubber stamps */
.stamps{display:flex;flex-wrap:wrap;gap:12px}
.bdg{font-family:var(--f-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;border:2px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;max-width:150px;line-height:1.2}
.bdg.on{border-style:solid;border-color:var(--accent);color:var(--accent);transform:rotate(-3deg)}
.bdg.on:nth-child(even){transform:rotate(2.5deg)}

/* results */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.panel h2{font-size:clamp(24px,5vw,34px)}
.panel p{color:var(--muted)}
.ls{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bg2);margin-top:14px}
.ls i{display:block;height:100%}.ls .k{background:var(--good)}.ls .w{background:var(--warn)}
.llegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.llegend b{font-family:var(--f-mono);color:var(--ink)}
.gradecard{width:min(260px,70vw);margin:4px auto 22px}
.gradecard .side{min-height:300px;align-items:center;justify-content:center;gap:6px}
.gradecard .g{font-family:var(--f-display);font-weight:800;font-size:140px;line-height:1;color:var(--c)}
.gradecard .gq{font-family:var(--f-display);font-weight:800;font-size:90px;color:var(--muted)}
.restable{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.restable td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.restable td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.tw{overflow-x:auto}

/* ---------- Állapot ---------- */
const KEY="kv-zh-gyakorlo-v1";
const fresh=()=>({xp:0,combo:0,m:{},badges:[],days:[],bestFlash:0,L:{},fc:{},lsel:"all"});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.L=S.L||{};S.fc=S.fc||{};if(S.lsel==null)S.lsel="all";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/₂/g,"2").replace(/₄/g,"4").replace(/₅/g,"5").replace(/³/g,"3");
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>new Date().toISOString().slice(0,10);
const pad2=n=>String(n).padStart(2,"0");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const touchDay=()=>{if(!S.days.includes(today()))S.days.push(today())};

function lvl(){let i=0;LEVELS.forEach((l,k)=>{if(S.xp>=l[0])i=k});const cur=LEVELS[i],nx=LEVELS[i+1];return{name:cur[1],pct:nx?(S.xp-cur[0])/(nx[0]-cur[0])*100:100}}
function streak(){const d=[...new Set(S.days)].sort();let n=0;let t=new Date(today());while(d.includes(t.toISOString().slice(0,10))){n++;t.setDate(t.getDate()-1)}return n}
function hud(){const L=lvl();$("#lvlName").textContent=L.name;$("#xpFill").style.width=L.pct+"%";$("#xp").textContent=S.xp;$("#combo").textContent="×"+S.combo;$("#streak").textContent=streak()}
function mastery(i){return S.m[i]||{s:0,n:0,b:0}}
function predicted(){let t=0;Q.forEach((_,i)=>t+=mastery(i).s);return t/Q.length*9}
function grade(p){return p>=31?5:p>=26?4:p>=22?3:p>=18?2:1}
const GNAME={5:"jeles",4:"jó",3:"közepes",2:"elégséges",1:"elégtelen"};
function award(id){if(!S.badges.includes(id)){S.badges.push(id);save();fx(40)}}
function checkBadges(){
  const seen=Object.keys(S.m).length;
  if(seen>=1)award("elso");if(seen>=Q.length/2)award("fel");if(seen>=Q.length)award("mind");
  if(TOPICS.some((_,t)=>Q.every((q,i)=>q[0]!==t||S.m[i])))award("tema");
  if(Object.values(S.L).filter(v=>v>=4).length>=10)award("tanult10");
}

/* ---------- Pontozás ---------- */
function autoHits(i,text){const t=norm(text);return Q[i][4].map(p=>t.trim().length>0&&new RegExp(p[1]).test(t))}
function scoreOf(i,checks){const hits=checks.filter(Boolean).length;return Math.min(4,Math.round(4*hits/Q[i][2]))}
function commit(i,sc,mult=true){
  const m=mastery(i);m.n++;m.s=sc;m.b=sc===4?Math.min(3,m.b+1):sc>=2?m.b:0;S.m[i]=m;
  if(sc===4){S.combo++;award("telitalalat")}else S.combo=0;
  if(S.combo>=5)award("combo5");
  const gain=Math.round(sc*10*(mult?1+0.25*Math.min(S.combo,4):1));
  S.xp+=gain;touchDay();checkBadges();save();hud();return gain;
}

/* ---------- Paklik ---------- */
function poolOf(sel){const ids=Q.map((_,i)=>i);if(sel==="all")return ids;if(sel==="minta")return MINTA.slice();return ids.filter(i=>Q[i][0]===+sel)}
function selLabel(sel){return sel==="all"?"Minden téma":sel==="minta"?"Minta ZH kérdései":`${+sel+1}. ${TOPICS[+sel].n}`}
function selHue(sel){return sel==="all"?150:sel==="minta"?85:HUE[+sel]}
function lStage(i){return S.L[i]||0}
function learnStats(ids){let k=0,w=0;ids.forEach(i=>{const s=lStage(i);if(s>=4)k++;else if(s>0)w++});return{k,w,n:ids.length-k-w,t:ids.length}}
function distractors(i,n,exclude){
  const mine=new Set(Q[i][4].map(p=>p[0]));const same=[],other=[];
  Q.forEach((q,j)=>{if(j===i)return;q[4].forEach(p=>{if(mine.has(p[0])||exclude.includes(p[0]))return;(q[0]===Q[i][0]?same:other).push(p[0])})});
  const s=shuffle(same),o=shuffle(other);return [...s.slice(0,Math.min(2,s.length)),...o].slice(0,n);
}

let keyH=null;function setKeys(f){if(keyH)document.removeEventListener("keydown",keyH);keyH=f;if(f)document.addEventListener("keydown",f)}
let timerId=null;function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
const typing=e=>/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName);

/* ---------- Kártya: megfordul, húzható ---------- */
function band(i,extra=""){const q=Q[i];return `<div class="band"><span class="b-no num">${pad2(q[0]+1)}</span><span class="b-t">${esc(TOPICS[q[0]].n)}</span>${q[3]?'<span class="b-mz">minta ZH</span>':""}${extra||`<span class="b-code num">KV ${q[0]+1}.${POS[i]}</span>`}</div>`}
function scene(i,front,back,o={}){
  return `<div class="scene" id="scene" style="--h:${HUE[Q[i][0]]}">
   <span class="stamp s-yes" aria-hidden="true">${o.yes||"MEGY"}</span><span class="stamp s-no" aria-hidden="true">${o.no||"MÉG NEM"}</span>
   <div class="fc" id="fc" tabindex="0" role="button" aria-pressed="false" aria-label="Kártya, megfordítható">
    <div class="side front">${band(i,o.bandExtra)}<div class="sb">${front}</div>${o.hint===false?"":`<div class="hint">${o.hint||"koppints · megfordul"}</div>`}</div>
    <div class="side back">${band(i,o.bandExtra)}<div class="sb ruled">${back}</div></div>
   </div></div>`;
}
function qFront(i,sub){const q=Q[i];return `<div class="qq">${esc(q[1])}</div>${sub===false?"":`<div class="meta">${sub||`4 pont · ${q[2]} elem kell`}</div>`}`}

function mountCard(o={}){
  const sc=$("#scene"),fc=$("#fc");
  const fit=()=>{const bk=fc.querySelector(".back"),fr=fc.querySelector(".front"),bd=bk.querySelector(".band"),sb=bk.querySelector(".sb");if(!sb)return;fr.style.minHeight=Math.min((bd?bd.offsetHeight:0)+sb.scrollHeight+2,o.cap||Math.max(360,innerHeight*.62))+"px"};fit();
  const isFlip=()=>fc.classList.contains("flip");
  const flip=v=>{fc.classList.toggle("flip",v===undefined?!isFlip():v);fc.setAttribute("aria-pressed",isFlip())};
  const shake=()=>{if(!reduce)sc.animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:260})};
  let x0=null,y0=0,dx=0,moved=false,busy=false;
  const canSwipe=()=>o.swipe&&(!o.swipe.enabled||o.swipe.enabled());
  const setT=(x)=>{sc.style.transform=x?`translateX(${x}px) rotate(${x/16}deg)`:"";const r=canSwipe()?x/110:0;sc.style.setProperty("--yes",Math.max(0,Math.min(1,r)));sc.style.setProperty("--no",Math.max(0,Math.min(1,-r)))};
  const fly=right=>{if(busy)return;busy=true;sc.classList.remove("drag");
    if(reduce){(right?o.swipe.right:o.swipe.left)();return}
    sc.style.setProperty(right?"--yes":"--no",1);sc.classList.add("fly");sc.style.transform=`translateX(${right?"":"-"}120vw) rotate(${right?"":"-"}26deg)`;
    setTimeout(()=>(right?o.swipe.right:o.swipe.left)(),280)};
  sc.addEventListener("pointerdown",e=>{if(busy||e.button>0||e.target.closest("input,label,a,button:not(.fc),textarea"))return;x0=e.clientX;y0=e.clientY;dx=0;moved=false;sc.setPointerCapture(e.pointerId);sc.classList.add("drag")});
  sc.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>7||Math.abs(e.clientY-y0)>7)moved=true;setT(canSwipe()?dx:dx*.12)});
  const end=()=>{if(x0===null)return;x0=null;sc.classList.remove("drag");
    if(moved&&canSwipe()&&Math.abs(dx)>95)return fly(dx>0);
    setT(0);if(!moved)(o.onTap||flip)()};
  sc.addEventListener("pointerup",end);sc.addEventListener("pointercancel",()=>{x0=null;sc.classList.remove("drag");setT(0)});
  fc.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();(o.onTap||flip)()}});
  return {flip,fly,isFlip,shake};
}

function cards(sel){
  stopTimer();setKeys(null);
  let ids=shuffle(poolOf(sel)),p=0,know=0,dont=[],hist=[];
  const draw=()=>{
    if(p>=ids.length)return done();
    const i=ids[p];
    app.innerHTML=`<div class="study">${topbar("Kártyák · "+selLabel(sel),`${p+1}/${ids.length}`)}${progress(p/ids.length)}
      ${scene(i,qFront(i,false),qBack(i))}
      <div class="dock"><div class="swipe"><button class="btn no" id="n">← Még nem megy</button><button class="btn yes" id="y">Megy →</button></div>${hist.length?`<button class="btn ghost sm undo" id="undo">↶ Mégse: az előző kártyát ${hist[hist.length-1].ok?"„Megy”":"„Még nem”"}-nek jelölted</button>`:""}
      <p class="small" style="text-align:center;margin:0">Koppints a kártyára vagy nyomj szóközt. Húzd jobbra/balra, vagy nyilak.</p></div></div>`;
    bindQuit();
    const c=mountCard({swipe:{right:()=>ans(true),left:()=>ans(false)}});
    const ans=ok=>{hist.push({i,ok,fc:S.fc[i],xp:S.xp});if(ok){know++;S.fc[i]=1;S.xp+=5}else{S.fc[i]=0;dont.push(i)}touchDay();save();hud();p++;draw()};
    if(hist.length)$("#undo").onclick=()=>{const h=hist.pop();if(h.fc===undefined)delete S.fc[h.i];else S.fc[h.i]=h.fc;S.xp=h.xp;if(h.ok)know--;else dont.pop();p--;save();hud();draw()};
    $("#y").onclick=()=>c.fly(true);$("#n").onclick=()=>c.fly(false);
    setKeys(e=>{if(typing(e))return;if(e.key===" "&&e.target.id!=="fc"){e.preventDefault();c.flip()}else if(e.key==="ArrowRight")c.fly(true);else if(e.key==="ArrowLeft")c.fly(false)});
  };
  const done=()=>{setKeys(null);if(!dont.length)fx(90);
    app.innerHTML=`<div class="study"><section class="panel"><div class="small">Kártyák · ${esc(selLabel(sel))}</div>
      <h2 class="num">${know} megy · ${dont.length} még nem</h2>
      <p>${dont.length?"A még nem menőket most újra kérheted. Addig pörgesd, amíg mind megy.":"Mind megy! Jöhet a Gyakorlás, ahol le is írod a választ."}</p>
      <div class="row">${dont.length?`<button class="btn go" id="again">A ${dont.length} nem menő újra</button>`:`<button class="btn go" id="prac">Gyakorlás írásban</button>`}<button class="btn" id="all">Az összes újra</button><span class="spacer"></span><button class="btn ghost" id="back">Főoldal</button></div></section></div>`;
    if(dont.length)$("#again").onclick=()=>{ids=shuffle(dont);dont=[];know=0;p=0;draw()};else $("#prac").onclick=()=>practice(sel);
    $("#all").onclick=()=>cards(sel);$("#back").onclick=home;scrollTo(0,0)};
  draw();scrollTo(0,0);
}

/* ---------- Tanulás: 0 megnézed · 1 melyik tartozik ide · 2 hiányzó elem · 3 felidézés · 4 kész ---------- */
const STG=["Ismerkedés","Melyik tartozik ide?","Hiányzó elem","Felidézés fejből"];
function learn(sel){
  stopTimer();setKeys(null);
  const all=poolOf(sel);
  const todo=all.filter(i=>lStage(i)<4);
  if(!todo.length)return learnDone(sel,true);
  /* Kör: legfeljebb 3 régebben látott, félkész kártya + új kártyák fejezetsorrendben, hogy haladj előre. */
  S.rn=(S.rn||0)+1;S.Ls=S.Ls||{};
  const wip=todo.filter(i=>lStage(i)>0).sort((a,b)=>(S.Ls[a]||0)-(S.Ls[b]||0)||lStage(b)-lStage(a));
  const unseen=todo.filter(i=>lStage(i)===0).sort((a,b)=>a-b);
  const old=wip.filter(i=>(S.Ls[i]||0)<S.rn-1);
  let round=[...old.slice(0,3)];
  for(const i of unseen){if(round.length>=7)break;round.push(i)}
  for(const i of wip){if(round.length>=7)break;if(!round.includes(i))round.push(i)}
  round.forEach(i=>S.Ls[i]=S.rn);save();
  const roundLen=round.length,views={};let queue=shuffle(round),step=0,right=0,total=0;
  const next=()=>{
    setKeys(null);
    if(!queue.length)return roundEnd();
    const i=queue.shift(),q=Q[i],s=lStage(i),pts=q[4].map(p=>p[0]);
    const ladder=`<span class="ladder" title="${s}/4 lépcső">${[0,1,2,3].map(k=>`<i class="${k<s?"on":""}"></i>`).join("")}</span>`;
    const advance=(ok,ns)=>{S.L[i]=ns;total++;if(ok){right++;S.xp+=ns>=4?20:8}touchDay();checkBadges();save();hud();step++;
      views[i]=(views[i]||0)+1;
      /* jó válasz után a körön belül még egyszer-kétszer visszajön; rossz válasz után csak egy későbbi körben */
      if(ns>=4)fx(30);else if(ok&&views[i]<3)queue.splice(Math.min(queue.length,2+Math.random()*3|0),0,i)};
    const cont=()=>{$("#act").innerHTML=`<button class="btn go" id="nx">Tovább <span class="kbd">↵</span></button>`;$("#nx").focus({preventScroll:true});$("#nx").onclick=next;setKeys(e=>{if(e.key==="Enter"&&!typing(e)){e.preventDefault();next()}})};
    let k=Math.random()*pts.length|0;
    const back=(hl)=>`<div class="bk-h">Válasz · ${q[2]} elem a 4 ponthoz</div><ol class="alist">${pts.map((x,j)=>`<li>${j===hl?`<span class="hit">${esc(x)}</span>`:esc(x)}</li>`).join("")}</ol>${q[5]?`<p class="cnote">${esc(q[5])}</p>`:""}<div id="vd"></div>`;
    let front=qFront(i,false);
    if(s===2)front=`<div class="qq" style="font-size:clamp(18px,3vw,22px);text-align:left">${esc(q[1])}</div><ol class="alist">${pts.map((x,j)=>`<li>${j===k?'<span class="gap">???</span>':esc(x)}</li>`).join("")}</ol>`;
    app.innerHTML=`<div class="study">${topbar("Tanulás · "+selLabel(sel))}${progress(step/(roundLen*3.2))}
      ${scene(i,front,back(s===1||s===2?k:-1),{bandExtra:ladder,hint:s===0?"koppints · nézd meg a választ":s===3?"gondold végig, aztán fordítsd meg":false,yes:"FEJBŐL MENT",no:"MÉG NEM"})}
      <div class="dock"><div class="lbl">${STG[s]}</div><div id="mid"></div><div class="row" id="act"></div></div></div>`;
    bindQuit();
    if(s===0){
      const c=mountCard({onTap:()=>{c.flip();show()}});let shown=false;
      $("#mid").innerHTML=`<p class="small" style="margin:0">Még semmit nem kell tudnod. Fordítsd meg a kártyát, és olvasd el a választ figyelmesen.</p>`;
      $("#act").innerHTML=`<button class="btn go" id="fl">Megfordítom <span class="kbd">↵</span></button>`;
      const show=()=>{if(shown)return;shown=true;$("#act").innerHTML=`<button class="btn go" id="ok">Elolvastam <span class="kbd">↵</span></button>`;$("#ok").focus({preventScroll:true});$("#ok").onclick=go};
      const go=()=>{advance(true,1);next()};
      $("#fl").onclick=()=>{c.flip(true);show()};
      setKeys(e=>{if(e.key==="Enter"&&!typing(e)){e.preventDefault();if(!shown){c.flip(true);show()}else go()}});
    }else if(s===1||s===2){
      const c=mountCard({cap:s===2?Math.max(360,innerHeight*.55):300,onTap:()=>{if(answered)c.flip();else c.shake()}});let answered=false;
      const correct=pts[k],opts=shuffle([correct,...distractors(i,3,pts)]);
      $("#mid").innerHTML=`<p class="small" style="margin:0">${s===1?"Melyik elem tartozik ennek a kérdésnek a válaszához?":"A kártyán egy elem helyén ??? áll. Melyik hiányzik?"}</p><div class="opts">${opts.map((o,j)=>`<button class="opt" data-o="${j}"><span class="n">${j+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
      const pick=j=>{if(answered)return;answered=true;const ok=opts[j]===correct;
        app.querySelectorAll(".opt").forEach((b,x)=>{b.disabled=true;if(opts[x]===correct)b.classList.add("right");else if(x===j)b.classList.add("wrong")});
        $("#vd").innerHTML=ok?`<span class="verdict ok">JÓ!</span>`:`<span class="verdict bad">NEM EZ</span>`;
        c.flip(true);advance(ok,ok?s+1:Math.max(1,s-1));
        $("#mid").insertAdjacentHTML("beforeend",`<p class="small" style="margin:8px 0 0">${ok?(s===1?"Következő lépcső: hiányzó elem.":"Következő lépcső: felidézés fejből."):"A helyes zölddel jelölve, a kártya hátulján kiemelve. Később újra jön."}</p>`);cont()};
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.o));
      setKeys(e=>{const n=+e.key;if(!typing(e)&&n>=1&&n<=opts.length){e.preventDefault();pick(n-1)}});
    }else{
      let shown=false,full=false,msg="";
      $("#mid").innerHTML=`<textarea id="ans" placeholder="Írd le fejből, amire emlékszel. A „Fejből ment” akkor nyomható meg, ha az elemek kb. 70%-a megvan."></textarea>`;
      $("#act").innerHTML=`<button class="btn go" id="sh">Megfordítom</button><span class="small">vagy koppints a kártyára</span>`;
      const resetScene=()=>{const sc=$("#scene");sc.classList.remove("fly");sc.style.transform="";sc.style.setProperty("--yes",0);sc.style.setProperty("--no",0)};
      const c=mountCard({onTap:()=>shown?c.flip():show(),swipe:{enabled:()=>shown&&!$("#nx"),right:()=>{resetScene();if(full)rate(true);else c.shake()},left:()=>{resetScene();rate(false)}}});
      const rateUI=()=>{$("#vd").innerHTML="";
        $("#act").innerHTML=`<div class="swipe" style="width:100%"><button class="btn no" id="n">← Még nem ment</button><button class="btn yes" id="y"${full?"":" disabled"}>Fejből ment →</button></div>${full?"":`<p class="small lock" style="margin:0;width:100%">🔒 ${msg}</p>`}`;
        $("#y").onclick=()=>{if(full)rate(true)};$("#n").onclick=()=>rate(false);
        setKeys(e=>{if(typing(e))return;if(e.key==="ArrowRight"&&full)rate(true);else if(e.key==="ArrowLeft")rate(false)})};
      const rate=ok=>{if(ok&&!full)return;setKeys(null);
        const snap={L:S.L[i],xp:S.xp,badges:S.badges.slice(),queue:queue.slice(),step,right,total};
        advance(ok,ok?4:2);
        $("#vd").innerHTML=ok?`<span class="verdict ok">MEGTANULVA ★</span>`:`<span class="verdict bad">MÉG GYAKOROLD</span>`;
        $("#act").innerHTML=`<button class="btn go" id="nx">Tovább <span class="kbd">↵</span></button><button class="btn ghost" id="undo">↶ Mégse, véletlen volt</button>`;
        $("#nx").focus({preventScroll:true});$("#nx").onclick=next;
        $("#undo").onclick=()=>{if(snap.L===undefined)delete S.L[i];else S.L[i]=snap.L;S.xp=snap.xp;S.badges=snap.badges;queue=snap.queue;step=snap.step;right=snap.right;total=snap.total;save();hud();rateUI()};
        setKeys(e=>{if(e.key==="Enter"&&!typing(e)&&e.target.tagName!=="BUTTON"){e.preventDefault();next()}})};
      const show=()=>{if(shown)return;shown=true;const t=$("#ans").value;$("#ans").readOnly=true;
        const h=t.trim()?autoHits(i,t):pts.map(()=>false),n=h.filter(Boolean).length;
        app.querySelectorAll(".back .alist li").forEach((li,j)=>{if(h[j])li.innerHTML=`<span class="hit">✓ ${esc(pts[j])}</span>`});
        const needOk=Math.max(1,Math.round(q[2]*0.7));full=n>=needOk;
        msg=!t.trim()?"Nem írtál le semmit, ezért nem jelölheted, hogy fejből ment. Egy későbbi körben újra jön.":`Legalább ${needOk} elem kell (kb. 70%), a leírt válaszodban ${n} van meg (zölddel pipálva). Nyomd a „Még nem ment”-et, egy későbbi körben újra jön.`;
        c.flip(true);rateUI()};
      $("#sh").onclick=show;$("#ans").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();show()}});
    }
    scrollTo(0,0);
  };
  const roundEnd=()=>{setKeys(null);
    const st=learnStats(all),fin=round.filter(i=>lStage(i)>=4).length;
    if(st.k===st.t)return learnDone(sel,false);
    fx(35);
    app.innerHTML=`<div class="study"><section class="panel"><div class="small">Kör vége · ${esc(selLabel(sel))}</div>
      <h2 class="num">${right}/${total} jó lépés</h2>
      <p>Ebben a körben ${fin} kártyát tanultál meg teljesen. Összesen ${st.k}/${st.t} megtanulva. Ami nem ment, az egy későbbi körben jön vissza, közben haladsz tovább az új kártyákkal.</p>
      <div class="ls"><i class="k" style="width:${st.k/st.t*100}%"></i><i class="w" style="width:${st.w/st.t*100}%"></i></div>
      <div class="llegend"><span>megtanulva <b>${st.k}</b></span><span>folyamatban <b>${st.w}</b></span><span>új <b>${st.n}</b></span></div>
      <div class="row" style="margin-top:18px"><button class="btn go" id="cont">Következő kör <span class="kbd">↵</span></button><span class="spacer"></span><button class="btn ghost" id="back">Főoldal</button></div></section></div>`;
    $("#cont").onclick=()=>learn(sel);$("#back").onclick=home;$("#cont").focus({preventScroll:true});
    setKeys(e=>{if(e.key==="Enter"){e.preventDefault();learn(sel)}});scrollTo(0,0)};
  next();
}
function learnDone(sel,already){
  setKeys(null);if(!already)fx(160);
  app.innerHTML=`<div class="study"><section class="panel"><div class="small">Tanulás · ${esc(selLabel(sel))}</div>
    <h2>${already?"Ezt a paklit már mind megtanultad.":"Mind megtanulva!"}</h2>
    <p>Most jön az éles próba: a Gyakorlásban leírod a választ és pontot kapsz rá, a ZH-próba pedig időre megy.</p>
    <div class="row"><button class="btn go" id="prac">Gyakorlás írásban</button><button class="btn" id="zhp">ZH-próba</button><button class="btn ghost" id="reset">Pakli újratanulása</button><span class="spacer"></span><button class="btn ghost" id="back">Főoldal</button></div></section></div>`;
  $("#prac").onclick=()=>practice(sel);$("#zhp").onclick=()=>zh(false);$("#back").onclick=home;
  $("#reset").onclick=()=>{poolOf(sel).forEach(i=>delete S.L[i]);save();learn(sel)};scrollTo(0,0);
}

/* ---------- Írásos gyakorlás és ZH ---------- */
function practiceQueue(sel){return shuffle(poolOf(sel)).sort((a,b)=>(mastery(a).b-mastery(b).b)||(mastery(a).s-mastery(b).s))}
function practice(sel){
  stopTimer();const queue=practiceQueue(sel);let pos=0,pts=0,done=0;
  const nx=()=>{if(pos>=queue.length){pos=0;queue.splice(0,queue.length,...practiceQueue(sel))}
    writeCard(queue[pos++],{title:"Gyakorlás · "+selLabel(sel),onDone:sc=>{pts+=sc;done++;nx()},footer:()=>`${done} kérdés · ${pts} pont ebben a körben`})};
  nx();
}
function zh(isMinta){
  stopTimer();let ids;
  if(isMinta)ids=MINTA.slice();
  else{const groups=[[0],[1,2],[3],[4,5],[4,5],[6,7],[7],[8],[9,10]];ids=[];groups.forEach(g=>{const pool=Q.map((_,i)=>i).filter(i=>g.includes(Q[i][0])&&!ids.includes(i));ids.push(shuffle(pool)[0])})}
  const res=[];let k=0;const t0=Date.now();
  const step=()=>{if(k>=ids.length)return zhResult(ids,res,isMinta,Date.now()-t0);
    writeCard(ids[k],{title:(isMinta?"Minta ZH":"ZH-próba")+` · ${k+1}/9`,progress:k/9,zh:true,t0,onDone:sc=>{res.push(sc);k++;step()},footer:()=>`eddig ${res.reduce((a,b)=>a+b,0)}/${res.length*4} pont`})};
  step();
}
function writeCard(i,o){
  setKeys(null);const q=Q[i],m=mastery(i);
  const back=`<div class="bk-h">Megoldókulcs · pipáld ki, amit tudtál</div><ul class="pts">${q[4].map((p,k)=>`<li><label><input type="checkbox" data-k="${k}"><span>${esc(p[0])}</span></label></li>`).join("")}</ul>${q[5]?`<p class="cnote">${esc(q[5])}</p>`:""}
    <div class="score"><div class="s num" id="sc">0<small>/4</small></div><div class="dots" id="dots">${"<i></i>".repeat(4)}</div></div>`;
  app.innerHTML=`<div class="study">${topbar(o.title)}${o.progress!=null?progress(o.progress):""}
    ${scene(i,qFront(i,`4 pont · ${q[2]} jó elem kell · ${"★".repeat(m.b)}${"☆".repeat(3-m.b)}`),back,{hint:"írd le lent, aztán fordítsd meg"})}
    <div class="dock" id="dock"><label class="lbl" for="ans">A válaszod · kulcsszavakra pontoz, a sorrend mindegy</label>
      <textarea id="ans" placeholder="pl. litoszféra, hidroszféra, …"></textarea>
      <div class="row" id="act"><button class="btn go" id="check">Ellenőrzés · megfordul <span class="kbd">⌘↵</span></button><button class="btn ghost" id="show">Nem tudom</button><span class="spacer"></span><small class="small">${o.footer?esc(o.footer()):""}</small></div></div></div>`;
  bindQuit();
  if(o.zh){const tick=()=>{const s=(Date.now()-o.t0)/1000|0;const el=$("#timer");if(el){el.textContent=`${pad2(s/60|0)}:${pad2(s%60)} / 45:00`;el.classList.toggle("hot",s>=2400)}};stopTimer();tick();timerId=setInterval(tick,1000)}else stopTimer();
  let revealed=false;
  const c=mountCard({onTap:()=>revealed?c.flip():reveal()});
  const ta=$("#ans");ta.focus({preventScroll:true});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();reveal()}});
  const upd=()=>{const ch=[...app.querySelectorAll(".pts input")].map(x=>x.checked);const sc=scoreOf(i,ch);$("#sc").innerHTML=sc+"<small>/4</small>";$("#dots").querySelectorAll("i").forEach((d,k)=>d.classList.toggle("on",k<sc));app.querySelectorAll(".pts label").forEach((l,k)=>l.classList.toggle("hit",ch[k]));return sc};
  const reveal=()=>{if(revealed)return;revealed=true;
    const hits=autoHits(i,ta.value);app.querySelectorAll(".pts input").forEach((x,k)=>{x.checked=hits[k];x.onchange=upd});upd();
    ta.readOnly=true;c.flip(true);
    $("#act").innerHTML=`<button class="btn go" id="next">Pont elfogadva, tovább <span class="kbd">↵</span></button><span class="toast" id="toast"></span><span class="spacer"></span><span class="small">A sárgákat a gép találta meg. Pipálj át, ha kell.</span>`;
    const go=()=>{const b=$("#next");if(b.disabled)return;const sc=upd();const gain=commit(i,sc,!o.zh);$("#toast").textContent=`+${gain} XP${S.combo>1?" · combo ×"+S.combo:""}`;if(sc===4)fx(S.combo>=3?60:25);b.disabled=true;setKeys(null);setTimeout(()=>o.onDone(sc),sc===4?650:380)};
    $("#next").onclick=go;$("#next").focus({preventScroll:true});
    setKeys(e=>{if(e.key==="Enter"&&!typing(e)&&e.target.tagName!=="BUTTON"){e.preventDefault();go()}})};
  $("#check").onclick=reveal;$("#show").onclick=()=>{ta.value="";reveal()};
  scrollTo(0,0);
}
function zhResult(ids,res,isMinta,ms){
  stopTimer();setKeys(null);
  const tot=res.reduce((a,b)=>a+b,0),g=grade(tot);
  if(isMinta)award("minta");
  S.xp+=tot*3;save();hud();
  const gh={5:150,4:110,3:85,2:50,1:25}[g];
  app.innerHTML=`<div class="study">
    <div class="scene gradecard" id="scene" style="--h:${gh}"><div class="fc" id="fc">
      <div class="side front" style="padding:20px"><div class="small">${isMinta?"Minta ZH":"ZH-próba"} · jegy</div><div class="g">${g}</div><div class="num">${tot}/36 pont · ${GNAME[g]}</div></div>
      <div class="side back" style="padding:20px"><div class="gq">?</div><div class="small">pontozás…</div></div></div></div>
    <section class="panel"><h2 class="num">${tot} / 36 pont</h2>
      <p>${GNAME[g]} · ${Math.round(ms/60000)} perc${g<5?` · a jeleshez még ${31-tot} pont kellett volna`:" · megvan az ötös!"}</p>
      <div class="tw"><table class="restable">${ids.map((i,k)=>`<tr><td>${esc(Q[i][1])}<br><small class="small">${esc(TOPICS[Q[i][0]].n)}</small></td><td>${res[k]}/4</td></tr>`).join("")}</table></div>
      <div class="row" style="margin-top:16px"><button class="btn go" id="again">Új ZH-próba</button><button class="btn" id="weak">A gyengéket gyakorlom</button><span class="spacer"></span><button class="btn ghost" id="back">Főoldal</button></div>
      <p class="small">+${tot*3} XP bónusz. Skála: 0–17: 1 · 18–21: 2 · 22–25: 3 · 26–30: 4 · 31–36: 5.</p></section></div>`;
  const fc=$("#fc");fc.style.transition="none";fc.classList.add("flip");fc.offsetWidth;fc.style.transition="";
  setTimeout(()=>{fc.classList.remove("flip");if(g===5){award("jeles");fx(180)}else if(g>=4)fx(60)},650);
  $("#again").onclick=()=>zh(false);$("#back").onclick=home;
  $("#weak").onclick=()=>{const w=ids.filter((i,k)=>res[k]<4);if(!w.length)return practice("all");let p=0;const nx=()=>{if(p>=w.length)return home();writeCard(w[p++],{title:"Gyengék újra",onDone:nx,footer:()=>`${p}/${w.length}`})};nx()};
  scrollTo(0,0);
}

/* ---------- Villámkör ---------- */
function flash(){
  stopTimer();setKeys(null);
  const ids=shuffle(Q.map((_,i)=>i));let p=0,ok=0,combo=0,best=0,left=90,over=false,hist=[];
  const draw=()=>{
    if(over)return;
    const i=ids[p%ids.length];
    app.innerHTML=`<div class="study">${topbar(`Villámkör · ${ok} tudtam · combo ×${combo}`,left+" mp")}${progress(left/90)}
      ${scene(i,qFront(i,false),qBack(i),{yes:"TUDTAM",no:"NEM"})}
      <div class="dock"><div class="swipe"><button class="btn no" id="n">← Nem tudtam</button><button class="btn yes" id="y">Tudtam →</button></div>${hist.length?`<button class="btn ghost sm undo" id="undo">↶ Mégse: az előzőt ${hist[hist.length-1].y?"„Tudtam”":"„Nem tudtam”"}-nak jelölted</button>`:""}
      <p class="small" style="text-align:center;margin:0">Fordítsd meg, légy őszinte. Tudtam = +15 XP × combo.</p></div></div>`;
    bindQuit();
    const c=mountCard({swipe:{right:()=>ans(true),left:()=>ans(false)}});
    $("#y").onclick=()=>c.fly(true);$("#n").onclick=()=>c.fly(false);
    if(hist.length)$("#undo").onclick=()=>{const h=hist.pop();ok=h.ok;combo=h.combo;best=h.best;S.xp=h.xp;p--;save();hud();draw()};
    setKeys(e=>{if(typing(e))return;if(e.key===" "&&e.target.id!=="fc"){e.preventDefault();c.flip()}else if(e.key==="ArrowRight")c.fly(true);else if(e.key==="ArrowLeft")c.fly(false)});
  };
  const ans=y=>{if(over)return;hist.push({y,ok,combo,best,xp:S.xp});if(y){ok++;combo++;best=Math.max(best,combo);S.xp+=Math.round(15*(1+0.2*Math.min(combo,5)));touchDay();save();hud();if(combo%3===0)fx(20)}else combo=0;p++;draw()};
  draw();
  timerId=setInterval(()=>{left--;const el=$("#timer");if(!el)return stopTimer();el.textContent=left+" mp";el.classList.toggle("hot",left<=10);const pr=app.querySelector(".prog i");if(pr)pr.style.width=left/90*100+"%";
    if(left<=0){stopTimer();over=true;setKeys(null);
      if(ok>=12)award("villam");S.bestFlash=Math.max(S.bestFlash||0,ok);save();
      app.innerHTML=`<div class="study"><section class="panel"><div class="small">Villámkör vége · rekord: <b class="num">${S.bestFlash}</b></div><h2 class="num">${ok} tudtam / ${p} kártya</h2><p>Leghosszabb combo: ×${best}. Ami nem ment, azt a Tanulásban lépésenként rendbe teheted.</p><div class="row"><button class="btn go" id="again">Még egy kör</button><span class="spacer"></span><button class="btn ghost" id="back">Főoldal</button></div></section></div>`;
      $("#again").onclick=flash;$("#back").onclick=home;if(ok>=10)fx(90)}},1000);
}

/* ---------- Konfetti ---------- */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function fx(n){if(reduce)return;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const cols=HUE.map(h=>`oklch(0.7 0.16 ${h})`);
  for(let k=0;k<n;k++)parts.push({x:innerWidth*(.2+.6*Math.random()),y:innerHeight*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*10-3,r:Math.random()*7+4,c:cols[k%cols.length],a:Math.random()*6,l:100});
  if(!raf)loop()}
function loop(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.a+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);cx.restore()});
  parts=parts.filter(p=>p.l>0&&p.y<innerHeight+20);raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

home();
</script>
